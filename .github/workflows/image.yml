name: image

# Builds the upstream Dockerfile (one change: apt-get upgrade in the base
# stage) and pushes it to GHCR. Upstream publishes no image; this fork exists
# only for this workflow. To update: merge upstream/master into master, the
# push starts a new build.
#
# A daily run rebuilds latest from master without cache, but publishes only
# if the published image has pending Debian package upgrades or the Ruby
# base image changed since it was built. Otherwise the digest of the
# published tags stays as it is.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and publish even if nothing changed
        required: false
        type: boolean
        default: false
  schedule:
    # Not at minute 0: GitHub delays or drops scheduled runs at the start of
    # the hour.
    - cron: "23 3 * * *"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  decide:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      push: ${{ steps.decide.outputs.push }}
      no_cache: ${{ steps.decide.outputs.no_cache }}
      base_name: ${{ steps.decide.outputs.base_name }}
      base_digest: ${{ steps.decide.outputs.base_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          IMAGE="${IMAGE,,}"  # registry names are lowercase
          # The base image the Dockerfile builds from, and what its tag points
          # at today (digest of the index).
          version=$(sed -n 's/^ARG RUBY_VERSION=\(.*\)/\1/p' Dockerfile | head -n1)
          [ -n "$version" ] || { echo "No ARG RUBY_VERSION in the Dockerfile" >&2; exit 1; }
          base_name="docker.io/library/ruby:$version-slim"
          raw=$(docker buildx imagetools inspect --raw "$base_name") || exit 1
          base_digest="sha256:$(printf '%s' "$raw" | sha256sum | cut -d' ' -f1)"
          push=true no_cache=false

          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then
            no_cache=true
            if [ "$FORCE" = true ]; then
              echo "Forced"
            elif ! out=$(docker pull --quiet --platform linux/amd64 "$IMAGE:latest" 2>&1); then
              if grep -qiE 'not found|manifest unknown' <<< "$out"; then
                echo "Nothing published yet"
              else
                echo "Cannot pull $IMAGE:latest: $out" >&2
                exit 1
              fi
            else
              # A failing "apt-get update" or "docker run" must not look like "nothing pending".
              upgrade=$(docker run --rm --platform linux/amd64 --user 0 --entrypoint bash "$IMAGE:latest" \
                -c 'apt-get -qq --error-on=any update >/dev/null && apt-get -s upgrade') || exit 1
              pending=$(grep -c '^Inst ' <<< "$upgrade" || true)
              built_from=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.base.digest" }}' "$IMAGE:latest")
              echo "Pending upgrades: $pending"
              echo "Base digest: published ${built_from:-none}, current $base_digest"
              if [ "$pending" -eq 0 ] && [ "$built_from" = "$base_digest" ]; then
                echo "up to date"
                push=false
              fi
            fi
          fi

          {
            echo "push=$push"
            echo "no_cache=$no_cache"
            echo "base_name=$base_name"
            echo "base_digest=$base_digest"
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: decide
    if: needs.decide.outputs.push == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Two runs probing the same -rN would overwrite each other's tag.
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The first unused sha-<short>-rN, found by asking the registry. Only a
      # "not found" answer means the tag is free; any other error fails the
      # job rather than risk overwriting an immutable tag.
      - name: Rebuild number
        id: rebuild
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          IMAGE="${IMAGE,,}"  # registry names are lowercase
          short=$(git rev-parse --short=7 HEAD)
          n=1
          while true; do
            if out=$(docker buildx imagetools inspect "$IMAGE:sha-$short-r$n" 2>&1); then
              n=$((n + 1))
            elif grep -qiE 'not found|manifest unknown' <<< "$out"; then
              break
            else
              echo "Cannot probe $IMAGE:sha-$short-r$n: $out" >&2
              exit 1
            fi
          done
          echo "n=$n" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"

      # latest and sha-<short> move with every rebuild; sha-<short>-rN stays.
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ steps.rebuild.outputs.short }}
            type=raw,value=sha-${{ steps.rebuild.outputs.short }}-r${{ steps.rebuild.outputs.n }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=LastSignal
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.base.name=${{ needs.decide.outputs.base_name }}
            org.opencontainers.image.base.digest=${{ needs.decide.outputs.base_digest }}

      # amd64 only: the clusters are amd64, and the native gems would take
      # long under QEMU. A scheduled or manual build ignores the cache: a
      # cached "apt-get upgrade" layer would carry old packages.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          no-cache: ${{ needs.decide.outputs.no_cache == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
