name: Image

# Builds the production Dockerfile for linux/amd64 and linux/arm64 and
# publishes a multi-arch image to GitHub Container Registry as
# ghcr.io/giovantenne/lastsignal.
#
# Two stages, following Docker's "distribute build across multiple runners"
# pattern (https://docs.docker.com/build/ci/github-actions/multi-platform/):
#
#   build   one matrix leg per platform, each on a native runner (no QEMU:
#           the native gems take far too long to compile under emulation).
#           Each leg pushes its image by digest only (no tags) and hands
#           the digest to the next job as a tiny artifact.
#   merge   stitches the per-platform digests into one manifest list, tags
#           it, and attaches a signed build-provenance attestation to it.
#
# Tags (all on the manifest list, so one tag serves both architectures):
#   X.Y.Z, X.Y, latest   pushes of a vX.Y.Z git tag (a release)
#   edge                 every push to master
#   sha-<short>          every build, for pinning to an exact commit
#
# Actions are pinned to full commit SHAs; the comment after each is the
# release it points at. Bump both together.
on:
  push:
    branches: [ master ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Registry names must be lowercase. The repository is giovantenne/lastsignal,
  # already lowercase, so this matches ghcr.io/${{ github.repository }}.
  REGISTRY_IMAGE: ghcr.io/giovantenne/lastsignal

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      # linux/arm64 -> linux-arm64, usable in artifact and cache scope names.
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the labels are used here (the tags go on the manifest list in the
      # merge job), but the tag configuration must match the merge job so the
      # org.opencontainers.image.version label derived from it is the same.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=sha-
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=LastSignal
            org.opencontainers.image.licenses=MIT

      # Push by digest only: the image is uploaded untagged and referenced by
      # its sha256 in the merge job. The GHA cache is scoped per platform so
      # the two legs do not overwrite each other's layers.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=${{ env.PLATFORM_PAIR }},mode=max
          # BuildKit's own provenance would wrap each image in an index, which
          # cannot be merged into a manifest list; the signed attestation is
          # attached to the final manifest list in the merge job instead.
          provenance: false

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # metadata-action lowercases the image name and adds the OCI source,
      # revision, created and version labels from the git context.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=sha-
          # latest=auto adds the latest tag only on semver git tags, so latest
          # always points at a release, never at an unreleased master build.
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=LastSignal
            org.opencontainers.image.licenses=MIT

      # The downloaded artifact directory holds one empty file per platform,
      # named after the image digest. DOCKER_METADATA_OUTPUT_JSON is exported
      # by metadata-action; its .tags are the fully qualified image:tag names.
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}

      - name: Manifest list digest
        id: manifest
        run: |
          digest="$(docker buildx imagetools inspect --format '{{json .Manifest}}' \
            ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }} | jq -r .digest)"
          echo "manifest list digest: $digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # subject-name must be lowercase and is not normalised here; see
      # REGISTRY_IMAGE above. The subject is the manifest list, so the
      # attestation covers both architectures.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
