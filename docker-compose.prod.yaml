# Production stack
# Usage: docker compose -f docker-compose.prod.yaml --env-file .env.production up -d --build

services:
  app:
    # Both `image` and `build` are set: `docker compose up -d` pulls the
    # prebuilt image of the latest release from GHCR (published for linux/amd64
    # and linux/arm64; built from source only if the pull fails), while
    # `docker compose up -d --build` builds locally from this checkout.
    # Set LASTSIGNAL_IMAGE_TAG (in .env.production or the shell) to run another
    # tag, e.g. `edge` for the current master build.
    # Update a running stack with: docker compose pull && docker compose up -d
    image: ghcr.io/giovantenne/lastsignal:${LASTSIGNAL_IMAGE_TAG:-latest}
    build: .
    ports:
      - "80:80"
    volumes:
      - lastsignal_storage:/rails/storage
    environment:
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      APP_BASE_URL: ${APP_BASE_URL}
      APP_HOST: ${APP_HOST}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_DOMAIN: ${SMTP_DOMAIN}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-LastSignal}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      PROCESS_CHECKINS_INTERVAL_MINUTES: ${PROCESS_CHECKINS_INTERVAL_MINUTES:-60}
      SOLID_QUEUE_IN_PUMA: "true"
    restart: unless-stopped

volumes:
  lastsignal_storage:
